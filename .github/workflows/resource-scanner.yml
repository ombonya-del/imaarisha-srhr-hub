name: Resource scanner

# Weekly web trawl for new SRHR knowledge resources (reports, policies, guidelines,
# toolkits, research). Files them into the Exchange as PENDING for admin approval;
# approved items auto-host as watermarked files where the source is fetchable.

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC
  workflow_dispatch:

env:
  SUPABASE_URL: https://uwxtqyqyrhhxqagaqelg.supabase.co
  ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3eHRxeXF5cmhoeHFhZ2FxZWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTA3MTUsImV4cCI6MjA4OTIyNjcxNX0.dLa7RY6awZC4HXnyUtoIXPZ8KJV0EEpPQR8YdOQ3hdA

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger resource-scanner
        env:
          CRON_SECRET: ${{ secrets.INGEST_CRON_SECRET }}
        run: |
          set -e
          RESP=$(curl -sS -w '\n%{http_code}' -X POST \
            "$SUPABASE_URL/functions/v1/resource-scanner" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "apikey: $ANON_KEY" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}' --max-time 120)
          echo "$RESP"
          [ "$(echo "$RESP" | tail -n1)" = "200" ] || exit 1
