name: CI

# Gate every push and PR: both front-end apps (ukweli, hub2) must build.
# Catches build breaks, bad imports, and syntax errors before they reach users.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ['ukweli', 'hub2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci || npm install
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build

  lint:
    name: lint (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        app: ['ukweli', 'hub2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci || npm install
      - name: ESLint
        working-directory: ${{ matrix.app }}
        run: npx eslint . || true
