<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#222736" />
  <title>ImaarishaSRHR Admin</title>
  <link rel="manifest" href="/admin.webmanifest" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Imaarisha Admin" />
  <style>
    :root { color-scheme: dark; }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#222736; color:#F6F2E8;
      background-image: radial-gradient(600px 380px at 12% -8%, rgba(217,154,38,0.16), transparent 60%),
        radial-gradient(560px 380px at 92% 108%, rgba(62,155,79,0.14), transparent 60%);
      font-family: system-ui, -apple-system, 'Nunito Sans', sans-serif; }
    .card { text-align:center; padding:34px 26px; max-width:340px; }
    img { height:56px; margin-bottom:16px; }
    h1 { font-size:22px; font-weight:800; margin:0 0 4px; }
    .sub { font-size:9px; font-weight:800; letter-spacing:.34em; color:#E8B14B; margin:0 0 18px; }
    p { font-size:13px; line-height:1.6; color:#C4C8D4; margin:0 0 22px; }
    a.btn { display:inline-block; text-decoration:none; font-weight:800; font-size:14px;
      padding:12px 26px; border-radius:26px; color:#241E12;
      background:linear-gradient(135deg, #E8B14B, #D9822B); }
    .hint { margin-top:18px; font-size:11px; color:#8A90A0; line-height:1.5; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo-mark.png" alt="" />
    <h1>Imaarisha<span style="color:#E8B14B">SRHR</span> Admin</h1>
    <p class="sub">ADMIN CONSOLE</p>
    <p id="msg">Opening the admin console…</p>
    <a class="btn" id="open" href="/#admin">Open the Admin Console →</a>
    <p class="hint" id="install-hint">Tip: use your browser’s <strong>Install app</strong> option to add this console to your home screen.</p>
  </div>
  <script>
    // Mark this browsing context as the standalone Admin app, so the SPA renders
    // its dedicated control-room shell (own header, no member tabs) instead of the hub.
    try { sessionStorage.setItem('imaarishaAdmin', '1'); } catch (e) {}
    document.getElementById('open').addEventListener('click', function () {
      try { sessionStorage.setItem('imaarishaAdmin', '1'); } catch (e) {}
    });
    // Register the shared service worker so this launcher is installable and
    // receives push (scope '/', so it also controls the main app).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    }
    // Launched as an installed app → jump straight into the console.
    var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
    if (standalone) {
      document.getElementById('install-hint').style.display = 'none';
      window.location.replace('/#admin');
    } else {
      // In a browser tab: stay put so the install prompt can surface; the button opens the console.
      document.getElementById('msg').textContent = 'Install this console, or open it in your browser.';
    }
  </script>
</body>
</html>
