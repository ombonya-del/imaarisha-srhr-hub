<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F5EF" />
  <title>ImaarishaSRHR Collective Hub</title>
  <!-- On the admin.* subdomain, present this origin as the standalone ImaarishaSRHR
       Admin app: swap in the admin manifest (so it installs as "ImaarishaSRHR Admin")
       and add the dark theme + Apple PWA metas for iOS installability. -->
  <script>
    (function () {
      if (location.hostname.slice(0, 6) !== 'admin.') return;
      var apply = function () {
        var l = document.querySelector('link[rel=manifest]');
        if (l) l.setAttribute('href', '/admin.webmanifest');
        else { l = document.createElement('link'); l.rel = 'manifest'; l.href = '/admin.webmanifest'; document.head.appendChild(l); }
        document.title = 'ImaarishaSRHR Admin';
        var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', '#222736');
        [['apple-mobile-web-app-capable', 'yes'], ['apple-mobile-web-app-status-bar-style', 'black-translucent'], ['apple-mobile-web-app-title', 'Imaarisha Admin']].forEach(function (m) {
          var el = document.createElement('meta'); el.name = m[0]; el.content = m[1]; document.head.appendChild(el);
        });
        var at = document.createElement('link'); at.rel = 'apple-touch-icon'; at.href = '/icon-192.png'; document.head.appendChild(at);
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply); else apply();
    })();
  </script>
  <link rel="icon" type="image/png" href="/logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
